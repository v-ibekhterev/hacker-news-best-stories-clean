name: beststories
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hackernews
      POSTGRES_USER: hackernews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackernews -d hackernews"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  api:
    build: .
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=hackernews;Username=hackernews;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Timeout=5;Command Timeout=30"
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
